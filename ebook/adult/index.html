<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B2A63">
<meta name="description" content="책장 넘기듯 읽는 성인편 웹북 「오후 반차」 — 감정노동 존중 부천다움">
<title>오후 반차 | 존중시민 웹북</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233B2A63'/%3E%3Cpath d='M13 17c10-4 18-1 19 3 1-4 9-7 19-3v32c-10-3-17-1-19 3-2-4-9-6-19-3z' fill='%23FDCF00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../assets/book.css">
<style>
  :root{
    --brand:#3B2A63;
    --accent:#FDCF00;
    --accent-ink:#2A1D48;
    --stage-a:#6B4FBB;
    --stage-b:#40306E;
    --stage-c:#1E1636;
    --page-bg:#fffdf8;
    --foot-bg:#F4F1FA;
    --foot-ink:#2A1D48;
    --foot-em:#6B4FBB;
  }
  .arrow{background:rgba(30,22,54,.62)}
  .hint{background:rgba(20,14,40,.62)}
</style>
</head>
<body>

<header>
  <button id="contentsButton" aria-label="목차 열기">☰</button>
  <button id="autoButton" aria-pressed="false" aria-label="자동 넘김 시작">▶</button>
  <div class="mid"><b>오후 반차</b><span>여섯 번의 마주침 · 성인편</span></div>
  <button id="speedButton" aria-label="자동 넘김 속도">6s</button>
  <button id="zoomButton" aria-label="이 쪽 크게 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
  <button id="fullscreenButton" aria-label="전체 화면">⛶</button>
</header>

<main>
  <div class="auto-bar" id="autoBar" hidden><i id="autoFill"></i></div>
  <div class="area" id="area"><div id="book"></div></div>
  <button class="arrow prev" id="prevButton" aria-label="이전 쪽">‹</button>
  <button class="arrow next" id="nextButton" aria-label="다음 쪽">›</button>
  <p class="hint" id="hint"><em>‹</em> 모서리를 끌거나 눌러서 넘겨 보세요 <em>›</em></p>
</main>

<footer>
  <div class="progress"><i id="progressBar"></i></div>
  <div class="meta"><strong id="pageTitle">표지</strong><span id="pageNumber">1 / 12</span></div>
</footer>

<dialog id="contentsDialog">
  <div class="dialog-head">
    <div><small>오후 반차 · 성인편</small><h2>목차</h2></div>
    <button id="closeContents" aria-label="목차 닫기">×</button>
  </div>
  <ol id="contentsList"></ol>
</dialog>

<div id="zoom" hidden>
  <button id="zoomClose" aria-label="크게 보기 닫기">×</button>
  <div id="zoomImg"></div>
</div>

<script>
window.BOOK = {
  dir: "pages",
  pages: [
    ["01.webp", "표지"],
    ["02.webp", "함께 일하는 사람들"],
    ["03.webp", "오늘 만나는 사람들"],
    ["04.webp", "출근길"],
    ["05.webp", "센터 사무실"],
    ["06.webp", "점심 식당"],
    ["07.webp", "주문 누락"],
    ["08.webp", "주민센터"],
    ["09.webp", "인터넷 문의"],
    ["10.webp", "편의점"],
    ["11.webp", "배달 리뷰"],
    ["12.webp", "뒷표지"]
  ]
};
</script>
<script src="../assets/page-flip.browser.js"></script>
<script src="../assets/book.js"></script>
</body>
</html>
